name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Skip paths that never reach the built image or the deploy job itself.
    # Verified against docker/Dockerfile.prod's COPY list before adding any
    # entry here — reports/** is ignored EXCEPT eval_summary.json, which
    # Dockerfile.prod bakes in directly and /eval/summary serves live.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'notebooks/**'
      - 'eval/**'
      - 'tests/**'
      - 'deploy/**'
      - 'reports/**'
      - '!reports/eval_summary.json'
  workflow_dispatch:

# Serialize deploys to the same ref — two unordered concurrent `gcloud run
# deploy` calls against the same Cloud Run service is a real race (whichever
# finishes last wins traffic, regardless of which commit is newer).
# cancel-in-progress: false — queue, don't cancel a deploy mid-cutover.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  GCP_PROJECT: triageiq-portfolio-495022
  AR_REPO: triageiq
  SERVICE_NAME: triageiq-api
  IMAGE: us-central1-docker.pkg.dev/triageiq-portfolio-495022/triageiq/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation (preferred over SA key)

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-deployer@triageiq-portfolio-495022.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify model artifacts against manifest (drift guard)
        run: python scripts/verify_model_manifest.py

      - name: Download production models from GCS
        run: |
          mkdir -p data/models data/processed
          gsutil -m cp \
            "gs://triageiq-portfolio-495022-models/models/component_classifier_microsoft_vscode.pkl" \
            "gs://triageiq-portfolio-495022-models/models/component_classifier_kubernetes_kubernetes.pkl" \
            "gs://triageiq-portfolio-495022-models/models/resolution_predictor_microsoft_vscode.pkl" \
            "gs://triageiq-portfolio-495022-models/models/resolution_predictor_kubernetes_kubernetes.pkl" \
            "gs://triageiq-portfolio-495022-models/models/cqr_conformal_adjustments.json" \
            data/models/
          gsutil -m cp -r \
            "gs://triageiq-portfolio-495022-models/models/dup_index_microsoft_vscode_bge" \
            "gs://triageiq-portfolio-495022-models/models/dup_index_kubernetes_kubernetes_bge" \
            data/models/
          gsutil -m cp \
            "gs://triageiq-portfolio-495022-models/processed/microsoft_vscode_temporal_train.parquet" \
            "gs://triageiq-portfolio-495022-models/processed/kubernetes_kubernetes_temporal_train.parquet" \
            data/processed/

      - name: Build and push image
        run: |
          docker build \
            -f docker/Dockerfile.prod \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run (candidate, no traffic)
        id: deploy
        run: |
          # Note: both secrets must exist in Secret Manager before first deploy:
          #   gcloud secrets create groq-api-key --replication-policy=automatic
          #   gcloud secrets create metrics-token --replication-policy=automatic
          #
          # --no-traffic --tag=candidate: deploy the new revision WITHOUT moving any live
          # traffic to it. This is what makes the smoke test below meaningful -- it hits the
          # candidate's own stable tagged URL, not the public service URL, so it always tests
          # THIS deploy's code regardless of what the service's traffic split currently is.
          # (Root cause this replaces: a prior deploy's rollback can pin the service's traffic
          # to a specific named revision, silently disabling Cloud Run's default "auto-promote
          # newest deploy" behavior for every deploy after it -- see issue #22. Under the old
          # flow, a pinned service meant new revisions landed at 0% traffic while the smoke
          # test still curled the public URL and passed against stale, already-live code.)
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 8 \
            --cpu-throttling \
            --timeout 300 \
            --startup-probe="httpGet.path=/health,httpGet.port=8080,timeoutSeconds=30,periodSeconds=60,failureThreshold=3" \
            --update-secrets GROQ_API_KEY=groq-api-key:latest,METRICS_TOKEN=metrics-token:latest \
            --update-env-vars ENVIRONMENT=prod \
            --no-traffic \
            --tag=candidate \
            --quiet
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.latestCreatedRevisionName)')
          CANDIDATE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['url'] for t in d['status']['traffic'] if t.get('tag') == 'candidate'))")
          PUBLIC_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Candidate revision: $REVISION"
          echo "Candidate URL (not yet promoted, tests THIS deploy only): $CANDIDATE_URL"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "candidate_url=$CANDIDATE_URL" >> $GITHUB_OUTPUT
          echo "url=$PUBLIC_URL" >> $GITHUB_OUTPUT

      - name: Smoke test (candidate revision, before it takes any traffic)
        id: smoke
        env:
          SMOKE_METRICS_TOKEN: ${{ secrets.SMOKE_TEST_METRICS_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.candidate_url }}"

          # 1. Health check — retry up to 5 times
          echo "=== /health ==="
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              break
            fi
            echo "Attempt $i: status $STATUS — retrying in 10s"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "FAILED: /health returned $STATUS"
            exit 1
          fi
          echo "Health: $(curl -sf "$URL/health")"

          # 2. Metrics endpoint — requires bearer token
          echo "=== /metrics ==="
          if [ -n "$SMOKE_METRICS_TOKEN" ]; then
            MSTATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $SMOKE_METRICS_TOKEN" "$URL/metrics")
            if [ "$MSTATUS" != "200" ]; then
              echo "FAILED: /metrics returned $MSTATUS"
              exit 1
            fi
            echo "Metrics check passed"
          else
            echo "SMOKE_TEST_METRICS_TOKEN not set — skipping /metrics check"
          fi

          # 3. Triage endpoint — synthetic issue
          echo "=== /triage ==="
          TBODY=$(curl -sf -X POST "$URL/triage" \
            -H "Content-Type: application/json" \
            -d '{"repo":"microsoft/vscode","title":"Extension host crashes on startup","body":"Every time I open VS Code the extension host process terminates immediately."}')
          if [ $? -ne 0 ]; then
            echo "FAILED: /triage returned non-200"
            exit 1
          fi
          COMPONENT=$(echo "$TBODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['predicted_component'])")
          if [ -z "$COMPONENT" ]; then
            echo "FAILED: predicted_component is empty"
            exit 1
          fi
          echo "Triage check passed — predicted_component=$COMPONENT"

      - name: Promote candidate to live traffic
        id: promote
        if: success()
        run: |
          # --to-latest (not --to-revisions <name>=100): always re-asserts "traffic follows
          # the newest ready revision" as the service's ongoing policy, rather than pinning to
          # this one revision by name. This is what makes a successful deploy self-healing --
          # even if a PRIOR deploy's failure had pinned traffic to some old revision by name
          # (disabling auto-promotion), this step overwrites that pin on every green deploy,
          # so the drift can no longer persist silently across deploys (issue #22).
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --to-latest
          echo "Promoted ${{ steps.deploy.outputs.revision }} to 100% live traffic."

      - name: Report candidate smoke-test failure (no rollback needed)
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          # The candidate was deployed with --no-traffic, so it never received any live
          # traffic -- whatever was serving before this run is still serving now, unaffected.
          # No traffic rollback is needed by construction. This just surfaces the failure
          # clearly rather than silently leaving the failed candidate revision around.
          echo "Smoke test failed for candidate revision ${{ steps.deploy.outputs.revision }}."
          echo "Live traffic was never moved to it -- the previously-live revision is still serving."
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format "value(status.traffic)"
          exit 1

      - name: Print deployment URL
        if: success()
        run: echo "Deployed to ${{ steps.deploy.outputs.url }} (revision ${{ steps.deploy.outputs.revision }})"
