name: Health Monitor

# Standing detection for exactly the failure mode that let the 2026-08-05 billing-account
# outage go unnoticed for up to 12 days: nothing was watching /health on a schedule, so a
# scale-to-zero Cloud Run service can silently stop being able to cold-start and nobody finds
# out until someone happens to hit it by hand. A failed run opens (or comments on) a labelled
# GitHub issue via the alert-on-failure job below (2026-09-24). GitHub's default
# scheduled-workflow-failure email alone proved insufficient: it fired throughout the 10+ day
# 2026-08 outage without being acted on.
#
# Status as of 2026-08-12 (ADR-0050 migration): this workflow is the PRIMARY automated check
# again. The GCP Cloud Monitoring uptime check described as primary as of 2026-08-10 lived in
# `expense-tracker-498014` -- the project just migrated OFF of after its own billing outage --
# and has not yet been recreated in `triageiq-prod-260812` (`scripts/setup_monitoring.sh` is
# updated to point at the new project but has not been re-run; tracked as follow-up, not done
# in this migration pass). Until that's redone, GitHub's ~34-135min real fire interval (measured
# 2026-08-10, throttled below its 30min nominal schedule on this low-activity repo) is the only
# automated interval-based check running, plus the new billing-check job below which closes the
# specific gap neither /health nor a GCP uptime check would catch promptly (see that job's own
# comment).
#
# The same investigation also found this workflow had been essentially non-functional as a
# check since it was written: 99/100 recent runs failed with curl error 28 (timeout) because
# --max-time was 20s and a genuine cold start (service runs --min-instances 0) measured at
# 36s live. See the step comment below for the fix. A monitor that constantly false-fires is
# worse than no monitor -- it trains the owner to ignore its alerts, which is the exact
# failure mode this workflow exists to prevent, just self-inflicted instead of external.

on:
  schedule:
    # Every 30 minutes nominal -- see the SECONDARY-check comment above for why the real
    # interval is wider and why that's now covered by the GCP uptime check instead.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      simulate:
        # Alert-path self-test (2026-09-24). An alert that has never been seen firing is not
        # proven; this lets a human force the alert-on-failure job to run on demand. The
        # simulated failure opens a separately labelled [SELF-TEST] issue, never the real alert.
        description: "Force a simulated failure to exercise the alert path (none = normal run)"
        type: choice
        options: [none, generic_failure, groq_key_rejected]
        default: none

concurrency:
  group: health-monitor
  cancel-in-progress: true

env:
  SERVICE_URL: https://triageiq-api-1014562031321.us-central1.run.app
  GCP_PROJECT: triageiq-prod-260812

jobs:
  billing-check:
    # 2026-08-12 addition (ADR-0050): both this project's billing outages (2026-08-05 and
    # 2026-08-12) were caught late or by accident -- /health alone can't catch either promptly,
    # because a warm Cloud Run revision keeps returning 200 for hours after billing is disabled;
    # the outage only becomes visible to /health on the service's next cold start, which is
    # unbounded for a low-traffic --min-instances=0 service. This checks the actual cause
    # directly instead of waiting on a downstream, delayable symptom (rule 85a: a control should
    # reach the real failure surface, not just a proxy for it).
    #
    # Runs as a dedicated, minimal-privilege service account (triageiq-billing-monitor,
    # roles/browser only -- the smallest project-level role that includes
    # resourcemanager.projects.get) rather than granting the deployer SA any new project-level
    # permission, keeping triageiq-deployer's own zero-project-level-grants property (ADR-0038/
    # 0050) intact. billing.viewer is not bindable at the project level (confirmed: GCP rejects
    # it with INVALID_ARGUMENT) -- roles/browser is the correct minimal role for this read.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (billing-monitor identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-billing-monitor@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Assert billing is enabled
        run: |
          # 2026-08-14: this read used to be
          #     ENABLED=$(gcloud billing projects describe ... --format='value(billingEnabled)')
          #     if [ "$ENABLED" != "True" ]; then <report DISABLED>; fi
          # which conflates two completely different facts. If the gcloud call FAILS -- the
          # monitor SA loses roles/browser, the Cloud Billing API gets disabled, WIF expires,
          # a network blip -- then $ENABLED is the empty string, and "" != "True", so the guard
          # announced a confirmed billing outage citing two real incidents and a recovery
          # runbook. It did exactly that on 2026-08-13/14 while the service was demonstrably
          # healthy (a 61s COLD START returned 200, and a cold start is impossible without
          # billing -- the very asymmetry the comment above relies on).
          #
          # That is worse than a guard going quiet. This is the alarm for the failure mode that
          # went undetected for 12 days; teaching its owner that it cries wolf disarms the one
          # signal that most needs to be believed. Both outcomes below still FAIL CLOSED -- the
          # job exits non-zero either way -- but they say different things, because the response
          # differs: UNVERIFIED means go fix the monitor's IAM, DISABLED means go relink billing.
          set -o pipefail
          if ! OUT=$(gcloud billing projects describe "${{ env.GCP_PROJECT }}" \
                       --format='value(billingEnabled)' 2>&1); then
            echo "::error::UNVERIFIED -- could not read billing state for ${{ env.GCP_PROJECT }}. This is NOT a confirmed outage: the check itself failed, most likely the triageiq-billing-monitor service account losing roles/browser, the Cloud Billing API being disabled, or WIF auth failing. Billing may be perfectly fine. Fix the monitor before drawing any conclusion about production. gcloud said: ${OUT}"
            exit 1
          fi
          echo "billingEnabled=${OUT}"
          case "${OUT}" in
            True)
              ;;
            False)
              echo "::error::Billing is DISABLED on ${{ env.GCP_PROJECT }} -- this is the exact failure mode from ADR-0038 (2026-08-05, undetected 12 days) and ADR-0050 (2026-08-12, caught by chance via CI). Production is still serving its current warm revision but will fail on the next cold start. See ADR-0050 for the recovery procedure (new project + billing account, do not attempt to relink without confirming the account itself is the problem)."
              exit 1
              ;;
            *)
              echo "::error::UNVERIFIED -- gcloud exited 0 but returned an unexpected billingEnabled value: '${OUT}'. Treated as a failure because an unrecognised answer is not a verified answer. Do not assume production is down; establish what this value means first."
              exit 1
              ;;
          esac

  model-availability-check:
    # Closes the gap that let /triage return 500 on every real request from 2026-08-16 (Groq
    # deprecated llama-3.1-8b-instant) through at least 2026-08-26 (a second, distinct failure --
    # the Groq API key itself started being rejected -- see PR discussion). /health never touched
    # either code path, so nothing caught it until manual investigation both times.
    #
    # Model IDs are read from src/triage_iq/model_config.py -- the single source of truth all
    # runtime consumers import from -- rather than grepped out of triage.py/triage_eval.py's
    # source text. A grep-based extraction breaks silently the moment the literal is replaced by
    # this very import; reading the actual module is the only way this check can't go stale the
    # same way the thing it monitors just did.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      failure_kind: ${{ steps.groq.outputs.failure_kind || steps.models.outputs.failure_kind }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read the production model from the single source of truth
        id: models
        run: |
          # TRIAGE_MODEL only (2026-09-24). This used to also check model_config.JUDGE_MODEL,
          # a Groq model retired 2026-08-16 that nothing in serving or eval calls (the eval
          # judge is local qwen3:8b). That made this job fail on every run, which trains its
          # owner to ignore it -- exactly the failure mode this workflow exists to prevent.
          TRIAGE_MODEL=$(PYTHONPATH=src python -c 'from triage_iq.model_config import TRIAGE_MODEL; print(TRIAGE_MODEL)')
          if [ -z "$TRIAGE_MODEL" ]; then
            echo "failure_kind=monitor_broken" >> "$GITHUB_OUTPUT"
            echo "::error::Could not read TRIAGE_MODEL from src/triage_iq/model_config.py. Fix this check, don't ignore it."
            exit 1
          fi
          echo "triage_model=$TRIAGE_MODEL" >> "$GITHUB_OUTPUT"
          echo "Configured triage model: $TRIAGE_MODEL"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-deployer@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get Groq API key from Secret Manager
        run: |
          KEY=$(gcloud secrets versions access latest \
            --secret=groq-api-key \
            --project=${{ env.GCP_PROJECT }})
          echo "::add-mask::$KEY"
          echo "GROQ_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Confirm the production key is accepted AND the production model is live on Groq
        id: groq
        run: |
          set -o pipefail
          RESP=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models)
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          # failure_kind feeds the alert-on-failure job, so a rejected key opens a distinctly
          # titled and labelled issue (1e). Two production keys have died without rotation.
          if [ "$HTTP_CODE" = "401" ]; then
            echo "failure_kind=groq_key_rejected" >> "$GITHUB_OUTPUT"
            echo "::error::Groq rejected the PRODUCTION API key (401 invalid_api_key) read from Secret Manager (groq-api-key:latest). This is NOT a model deprecation. Every /triage request is failing. Rotate: add a new Secret Manager version, then redeploy."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "failure_kind=groq_unverified" >> "$GITHUB_OUTPUT"
            echo "::error::UNVERIFIED -- Groq /models returned HTTP $HTTP_CODE, not 200. This is NOT a confirmed model removal or key issue: the check itself failed (Groq API issue, network blip). Body: $BODY"
            exit 1
          fi
          LIVE_IDS=$(echo "$BODY" | python3 -c "import json,sys; print('\n'.join(m['id'] for m in json.load(sys.stdin)['data']))")
          MODEL="${{ steps.models.outputs.triage_model }}"
          if ! echo "$LIVE_IDS" | grep -qxF "$MODEL"; then
            echo "failure_kind=model_retired" >> "$GITHUB_OUTPUT"
            echo "::error::Production model '$MODEL' (src/triage_iq/model_config.py TRIAGE_MODEL) is no longer in Groq's live model catalog -- it has been deprecated/removed. Check console.groq.com/docs/deprecations for the documented replacement, do not guess a replacement name."
            exit 1
          fi
          echo "Key accepted; production model '$MODEL' is live on Groq."

  check:
    runs-on: ubuntu-latest
    outputs:
      failure_kind: ${{ steps.health.outputs.failure_kind }}
    steps:
      - name: Hit /health?deps=1, fail loudly on anything but 200 + status=ok
        id: health
        run: |
          # 2026-09-24: ?deps=1 added. Bare /health is liveness only: it reports
          # groq_key_present, never whether Groq accepts the key, so on 2026-09-24 a revoked
          # production key would have passed this check while every /triage returned 500.
          # ?deps=1 makes one zero-token authenticated Groq call (models.list) and returns 503
          # with a per-dependency detail when anything is unhealthy -- see app.py's health().
          # --max-time was 20s until 2026-08-10 -- discovered false-failing on ~99/100 runs
          # (curl error 28, timeout) because the service runs --min-instances 0 (deploy.yml)
          # and a genuine cold start (loading BGE embeddings + FAISS indices + classifiers)
          # measured at 36s live, well past 20s. Cloud Run's own startup probe
          # (deploy.yml: timeoutSeconds=30, periodSeconds=60, failureThreshold=3) tolerates up
          # to ~180s before considering an instance failed, so 90s here still fails well before
          # that ceiling while giving a real cold start comfortable margin. Two attempts (not
          # one) absorb the rare case where the checked instance scales down between connect
          # and response; worst case ~190s total, negligible against the 30min run cadence.
          #
          # 2026-08-14: the 20s -> 90s fix above made the check stop false-failing, but left it
          # binary -- an 85s cold start passed silently and an 91s one read as an outage. So it
          # answered "did it respond inside 90s", not "is cold-start time drifting", and a
          # gradually slowing boot (a larger index, a heavier model, an added warm-up step) was
          # invisible until the moment it crossed the ceiling and looked like a hard failure.
          # SOFT_LIMIT_S adds the middle state: still a pass, but a visible warning with the
          # number attached, so a regression shows as a trend before it becomes a page. 45s is
          # set above the 36s cold start measured 2026-08-10 with enough headroom not to fire on
          # ordinary variance -- deliberately NOT tight, because a warning that cries wolf decays
          # into noise exactly like the 20s timeout did.
          HARD_LIMIT_S=90
          SOFT_LIMIT_S=45
          check() {
            ATTEMPT="$1"
            # %{time_total} is curl's own wall-clock for the whole transfer -- the cold start is
            # inside it, since Cloud Run holds the connection open while the instance boots.
            RESP=$(curl -sS -w "\n%{http_code} %{time_total}" --max-time "$HARD_LIMIT_S" "${{ env.SERVICE_URL }}/health?deps=1")
            META=$(echo "$RESP" | tail -1)
            HTTP_CODE=${META%% *}
            ELAPSED=${META##* }
            BODY=$(echo "$RESP" | sed '$d')
            LAST_CODE="$HTTP_CODE"
            LAST_BODY="$BODY"
            echo "HTTP $HTTP_CODE in ${ELAPSED}s (attempt $ATTEMPT)"
            echo "$BODY"
            # Greppable marker, same convention as the kill-switch's AUTOMATED_KILLSWITCH_FIRED:
            # makes latency recoverable from run logs later without adding a metrics backend.
            echo "HEALTH_LATENCY {\"attempt\":$ATTEMPT,\"seconds\":$ELAPSED,\"http\":$HTTP_CODE}"
            [ "$HTTP_CODE" = "200" ] || return 1
            STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            [ "$STATUS" = "ok" ] || return 1
            # Attempt 1 is the only meaningful cold-start sample: if it succeeded, attempt 2
            # never runs, and if it failed the instance is already warm for the retry. So the
            # trend warning is scoped to attempt 1 -- warning on a warm retry would measure
            # nothing and train the reader to ignore the marker.
            if [ "$ATTEMPT" = "1" ] && awk "BEGIN{exit !($ELAPSED > $SOFT_LIMIT_S)}"; then
              echo "::warning::/health answered in ${ELAPSED}s, past the ${SOFT_LIMIT_S}s soft limit (hard fail at ${HARD_LIMIT_S}s). The service is UP -- this is a cold-start trend signal, not an outage. Cold start measured 36s on 2026-08-10; investigate what grew before it reaches ${HARD_LIMIT_S}s and starts reading as downtime."
            fi
          }
          if check 1; then
            echo "Health check passed."
            exit 0
          fi
          echo "First attempt failed -- retrying once before alerting."
          if check 2; then
            echo "Health check passed on retry."
            exit 0
          fi
          # Classify the final failure so the alert says WHICH failure it is. A rejected Groq
          # key gets its own kind: it has taken production down twice without rotation.
          KIND=$(LAST_CODE="$LAST_CODE" LAST_BODY="$LAST_BODY" python3 -c '
          import json, os
          code, body = os.environ.get("LAST_CODE", ""), os.environ.get("LAST_BODY", "")
          try:
              deps = json.loads(body).get("dependencies") or []
          except Exception:
              deps = []
          bad = [d for d in deps if not d.get("healthy")]
          groq = next((d for d in bad if d.get("name") == "groq"), None)
          detail = (groq or {}).get("detail", "")
          if groq and ("401" in detail or "invalid_api_key" in detail or "AuthenticationError" in detail):
              print("groq_key_rejected")
          elif bad:
              print("dependency_unhealthy")
          elif code in ("", "000"):
              print("unreachable")
          else:
              print("unhealthy")
          ')
          echo "failure_kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ "$KIND" = "groq_key_rejected" ]; then
            echo "::error::PRODUCTION GROQ KEY REJECTED -- /health?deps=1 reports the groq dependency unhealthy with an authentication failure. Every /triage request is failing. Rotate the key (new Secret Manager version of groq-api-key) and redeploy."
          else
            echo "::error::/health?deps=1 failed twice in a row ($KIND) -- service may be down (billing, quota, crash-looping, or a bad deploy), or a dependency is unhealthy (503; details above)."
          fi
          exit 1

  alert-selftest:
    # Only on a manual dispatch with simulate != none; skipped on every scheduled run.
    if: github.event_name == 'workflow_dispatch' && inputs.simulate != 'none'
    runs-on: ubuntu-latest
    outputs:
      failure_kind: ${{ steps.sim.outputs.failure_kind }}
    steps:
      - name: Simulate a monitor failure
        id: sim
        run: |
          echo "failure_kind=${{ inputs.simulate }}" >> "$GITHUB_OUTPUT"
          echo "::error::SIMULATED failure (kind=${{ inputs.simulate }}) to exercise alert-on-failure. Not a real outage."
          exit 1

  alert-on-failure:
    # From draft #104 (2026-09-24), rewired to this workflow's jobs. GitHub's default
    # scheduled-workflow-failure email was the only signal during the 10+ day outage and it
    # fired on every failed run without being acted on. This opens (or comments on) a labelled
    # GitHub issue instead, using only the default GITHUB_TOKEN -- no new secret.
    runs-on: ubuntu-latest
    needs: [billing-check, model-availability-check, check, alert-selftest]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    steps:
      - name: Open or update the health-monitor alert issue
        uses: actions/github-script@v8
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const failed = Object.entries(needs).filter(([, v]) => v.result === 'failure');
            const kinds = failed.map(([job, v]) => `${job}: ${(v.outputs && v.outputs.failure_kind) || 'unclassified'}`);
            const selftest = needs['alert-selftest'] && needs['alert-selftest'].result === 'failure';
            const keyRejected = failed.some(([, v]) => v.outputs && v.outputs.failure_kind === 'groq_key_rejected');

            // Self-test issues never mix with real alerts: separate label and title.
            const baseLabel = selftest ? 'health-monitor-selftest' : 'health-monitor-alert';
            const labels = keyRejected ? [baseLabel, 'groq-key-rejected'] : [baseLabel];
            let title = 'Health Monitor: standing failure';
            if (keyRejected) title = 'Health Monitor: PRODUCTION GROQ KEY REJECTED (401)';
            if (selftest) title = `[SELF-TEST] ${title}`;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              keyRejected
                ? '**Groq rejected the production API key.** Every /triage request fails. Rotate: add a new Secret Manager version of `groq-api-key`, then redeploy.'
                : 'One or more health-monitor jobs failed.',
              '',
              `Failed job(s) and failure kind: **${kinds.join('; ')}**`,
              `Run: ${runUrl}`,
              `Time: ${new Date().toISOString()}`,
              '',
              selftest
                ? 'SELF-TEST: this run was dispatched with `simulate` set; it proves the alert path fires. Close this issue.'
                : 'Auto-created by health-monitor.yml. Closing it does not stop later failing runs from reopening it; fix the cause.',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: labels.join(','),
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.data[0].number, body,
              });
              core.notice(`Commented on existing alert issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels,
              });
              core.notice(`Opened alert issue #${created.data.number}`);
            }
