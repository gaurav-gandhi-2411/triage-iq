name: Eval Regression Gate

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: us-central1
  GCP_PROJECT: expense-tracker-498014

jobs:
  structural-invariants:
    name: Structural invariants (no LLM)
    runs-on: ubuntu-latest
    # Promoted to blocking 2026-08-10: continue-on-error had masked this job's own
    # failures for weeks on three separate occasions (model-manifest drift ~3.5 weeks,
    # a broken _load_classifier import, and a stale grounding-ratchet baseline hash --
    # the eval baseline write on 2026-08-10 was what actually surfaced the third one).
    # A check that can't fail loudly rots silently -- demonstrated three times, not
    # hypothesized. Confirmed genuinely green (all 8 tests passing, not masked) on
    # three consecutive live runs before this flip.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-deployer@expense-tracker-498014.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download production models from GCS
        run: |
          mkdir -p data/models data/processed
          gsutil -m cp \
            "gs://triageiq-models/models/component_classifier_microsoft_vscode.pkl" \
            "gs://triageiq-models/models/component_classifier_kubernetes_kubernetes.pkl" \
            "gs://triageiq-models/models/resolution_predictor_microsoft_vscode.pkl" \
            "gs://triageiq-models/models/resolution_predictor_kubernetes_kubernetes.pkl" \
            "gs://triageiq-models/models/cqr_conformal_adjustments.json" \
            data/models/
          gsutil -m cp -r \
            "gs://triageiq-models/models/similar_issue_index_microsoft_vscode_bge" \
            "gs://triageiq-models/models/similar_issue_index_kubernetes_kubernetes_bge" \
            data/models/
          gsutil -m cp \
            "gs://triageiq-models/processed/microsoft_vscode_temporal_train.parquet" \
            "gs://triageiq-models/processed/kubernetes_kubernetes_temporal_train.parquet" \
            data/processed/

      - name: Verify GCS artifacts match MANIFEST.sha256 (drift guard)
        run: python scripts/verify_model_manifest.py

      - name: Run structural invariants (offline — no LLM calls)
        run: pytest eval/test_invariants.py -v --no-cov

  quality-regression:
    name: Quality regression (cassette-replayed judge)
    runs-on: ubuntu-latest
    needs: []
    # Promoted to blocking 2026-08-10 -- see the matching comment on structural-invariants
    # above for the three-strikes rationale. This job includes what used to be the
    # informational-only fabrication_rate/prose_number_contradiction checks (ADR-0028
    # Phase B3, ADR-0042 LEVER 4) -- both measure 0/64 on the current baseline, confirmed
    # genuinely passing (not masked) on three consecutive live runs before this flip.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-deployer@expense-tracker-498014.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download production models from GCS
        run: |
          mkdir -p data/models data/processed
          gsutil -m cp \
            "gs://triageiq-models/models/component_classifier_microsoft_vscode.pkl" \
            "gs://triageiq-models/models/component_classifier_kubernetes_kubernetes.pkl" \
            "gs://triageiq-models/models/resolution_predictor_microsoft_vscode.pkl" \
            "gs://triageiq-models/models/resolution_predictor_kubernetes_kubernetes.pkl" \
            "gs://triageiq-models/models/cqr_conformal_adjustments.json" \
            data/models/
          gsutil -m cp -r \
            "gs://triageiq-models/models/similar_issue_index_microsoft_vscode_bge" \
            "gs://triageiq-models/models/similar_issue_index_kubernetes_kubernetes_bge" \
            data/models/
          gsutil -m cp \
            "gs://triageiq-models/processed/microsoft_vscode_temporal_train.parquet" \
            "gs://triageiq-models/processed/kubernetes_kubernetes_temporal_train.parquet" \
            data/processed/

      - name: Verify GCS artifacts match MANIFEST.sha256 (drift guard)
        run: python scripts/verify_model_manifest.py

      - name: Diagnose synthesis key for vscode-2093 (platform fingerprint)
        run: python -W ignore scripts/diag_ci_key.py

      - name: Run quality regression gate (offline — cassette replay, no live LLM)
        run: pytest eval/test_quality_regression.py -v --no-cov
