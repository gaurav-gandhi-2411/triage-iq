[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "triage-iq"
version = "0.1.0"
description = "Production-grade GitHub Issue intelligence: classification, duplicate detection, resolution prediction, LLM triage"
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/triage_iq --cov-report=term-missing -v"
