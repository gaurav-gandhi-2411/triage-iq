name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Security audit
        run: |
          # CVE-2026-1839 suppressed: unsafe torch.load() in Trainer._load_rng_state()
          # (transformers/trainer.py). Vulnerable code path is training checkpoint
          # restoration — TriageIQ never imports Trainer and has no surface to reach it.
          # Fix requires transformers>=5.0.0rc3, which needs sentence-transformers>=5.x
          # (triple major bump). Revisit when sentence-transformers 5.x is stable and
          # a planned dependency refresh is scheduled.
          # NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-1839
          pip-audit -r requirements.lock --skip-editable --ignore-vuln CVE-2026-1839

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/triage_iq/api/ src/triage_iq/models/triage.py

      - name: Run tests
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: python -m pytest tests/ --no-header

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn
