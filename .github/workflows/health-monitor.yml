name: Health Monitor

# Standing detection for exactly the failure mode that let the 2026-08-05 billing-account
# outage go unnoticed for up to 12 days: nothing was watching /health on a schedule, so a
# scale-to-zero Cloud Run service can silently stop being able to cold-start and nobody finds
# out until someone happens to hit it by hand. A failed run sends GitHub's default
# scheduled-workflow-failure email to the repo owner -- no extra notification wiring needed.
#
# Status as of 2026-08-12 (ADR-0050 migration): this workflow is the PRIMARY automated check
# again. The GCP Cloud Monitoring uptime check described as primary as of 2026-08-10 lived in
# `expense-tracker-498014` -- the project just migrated OFF of after its own billing outage --
# and has not yet been recreated in `triageiq-prod-260812` (`scripts/setup_monitoring.sh` is
# updated to point at the new project but has not been re-run; tracked as follow-up, not done
# in this migration pass). Until that's redone, GitHub's ~34-135min real fire interval (measured
# 2026-08-10, throttled below its 30min nominal schedule on this low-activity repo) is the only
# automated interval-based check running, plus the new billing-check job below which closes the
# specific gap neither /health nor a GCP uptime check would catch promptly (see that job's own
# comment).
#
# The same investigation also found this workflow had been essentially non-functional as a
# check since it was written: 99/100 recent runs failed with curl error 28 (timeout) because
# --max-time was 20s and a genuine cold start (service runs --min-instances 0) measured at
# 36s live. See the step comment below for the fix. A monitor that constantly false-fires is
# worse than no monitor -- it trains the owner to ignore its alerts, which is the exact
# failure mode this workflow exists to prevent, just self-inflicted instead of external.

on:
  schedule:
    # Every 30 minutes nominal -- see the SECONDARY-check comment above for why the real
    # interval is wider and why that's now covered by the GCP uptime check instead.
    - cron: '*/30 * * * *'
    # 2026-08-18 addition (Item 271/C6): every 30 minutes is right for /health (process
    # liveness, no external cost) but not for /triage, which calls Groq for real -- see the
    # triage-check job below for why this still isn't meaningfully increasing spend. Runs on
    # its own cron so a change to one cadence doesn't have to touch the other.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: true

env:
  SERVICE_URL: https://triageiq-api-1014562031321.us-central1.run.app
  GCP_PROJECT: triageiq-prod-260812

jobs:
  billing-check:
    # 2026-08-12 addition (ADR-0050): both this project's billing outages (2026-08-05 and
    # 2026-08-12) were caught late or by accident -- /health alone can't catch either promptly,
    # because a warm Cloud Run revision keeps returning 200 for hours after billing is disabled;
    # the outage only becomes visible to /health on the service's next cold start, which is
    # unbounded for a low-traffic --min-instances=0 service. This checks the actual cause
    # directly instead of waiting on a downstream, delayable symptom (rule 85a: a control should
    # reach the real failure surface, not just a proxy for it).
    #
    # Runs as a dedicated, minimal-privilege service account (triageiq-billing-monitor,
    # roles/browser only -- the smallest project-level role that includes
    # resourcemanager.projects.get) rather than granting the deployer SA any new project-level
    # permission, keeping triageiq-deployer's own zero-project-level-grants property (ADR-0038/
    # 0050) intact. billing.viewer is not bindable at the project level (confirmed: GCP rejects
    # it with INVALID_ARGUMENT) -- roles/browser is the correct minimal role for this read.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (billing-monitor identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-billing-monitor@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Assert billing is enabled
        run: |
          # 2026-08-14: this read used to be
          #     ENABLED=$(gcloud billing projects describe ... --format='value(billingEnabled)')
          #     if [ "$ENABLED" != "True" ]; then <report DISABLED>; fi
          # which conflates two completely different facts. If the gcloud call FAILS -- the
          # monitor SA loses roles/browser, the Cloud Billing API gets disabled, WIF expires,
          # a network blip -- then $ENABLED is the empty string, and "" != "True", so the guard
          # announced a confirmed billing outage citing two real incidents and a recovery
          # runbook. It did exactly that on 2026-08-13/14 while the service was demonstrably
          # healthy (a 61s COLD START returned 200, and a cold start is impossible without
          # billing -- the very asymmetry the comment above relies on).
          #
          # That is worse than a guard going quiet. This is the alarm for the failure mode that
          # went undetected for 12 days; teaching its owner that it cries wolf disarms the one
          # signal that most needs to be believed. Both outcomes below still FAIL CLOSED -- the
          # job exits non-zero either way -- but they say different things, because the response
          # differs: UNVERIFIED means go fix the monitor's IAM, DISABLED means go relink billing.
          set -o pipefail
          if ! OUT=$(gcloud billing projects describe "${{ env.GCP_PROJECT }}" \
                       --format='value(billingEnabled)' 2>&1); then
            echo "::error::UNVERIFIED -- could not read billing state for ${{ env.GCP_PROJECT }}. This is NOT a confirmed outage: the check itself failed, most likely the triageiq-billing-monitor service account losing roles/browser, the Cloud Billing API being disabled, or WIF auth failing. Billing may be perfectly fine. Fix the monitor before drawing any conclusion about production. gcloud said: ${OUT}"
            exit 1
          fi
          echo "billingEnabled=${OUT}"
          case "${OUT}" in
            True)
              ;;
            False)
              echo "::error::Billing is DISABLED on ${{ env.GCP_PROJECT }} -- this is the exact failure mode from ADR-0038 (2026-08-05, undetected 12 days) and ADR-0050 (2026-08-12, caught by chance via CI). Production is still serving its current warm revision but will fail on the next cold start. See ADR-0050 for the recovery procedure (new project + billing account, do not attempt to relink without confirming the account itself is the problem)."
              exit 1
              ;;
            *)
              echo "::error::UNVERIFIED -- gcloud exited 0 but returned an unexpected billingEnabled value: '${OUT}'. Treated as a failure because an unrecognised answer is not a verified answer. Do not assume production is down; establish what this value means first."
              exit 1
              ;;
          esac

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health, fail loudly on anything but 200 + status=ok
        run: |
          # --max-time was 20s until 2026-08-10 -- discovered false-failing on ~99/100 runs
          # (curl error 28, timeout) because the service runs --min-instances 0 (deploy.yml)
          # and a genuine cold start (loading BGE embeddings + FAISS indices + classifiers)
          # measured at 36s live, well past 20s. Cloud Run's own startup probe
          # (deploy.yml: timeoutSeconds=30, periodSeconds=60, failureThreshold=3) tolerates up
          # to ~180s before considering an instance failed, so 90s here still fails well before
          # that ceiling while giving a real cold start comfortable margin. Two attempts (not
          # one) absorb the rare case where the checked instance scales down between connect
          # and response; worst case ~190s total, negligible against the 30min run cadence.
          #
          # 2026-08-14: the 20s -> 90s fix above made the check stop false-failing, but left it
          # binary -- an 85s cold start passed silently and an 91s one read as an outage. So it
          # answered "did it respond inside 90s", not "is cold-start time drifting", and a
          # gradually slowing boot (a larger index, a heavier model, an added warm-up step) was
          # invisible until the moment it crossed the ceiling and looked like a hard failure.
          # SOFT_LIMIT_S adds the middle state: still a pass, but a visible warning with the
          # number attached, so a regression shows as a trend before it becomes a page. 45s is
          # set above the 36s cold start measured 2026-08-10 with enough headroom not to fire on
          # ordinary variance -- deliberately NOT tight, because a warning that cries wolf decays
          # into noise exactly like the 20s timeout did.
          HARD_LIMIT_S=90
          SOFT_LIMIT_S=45
          check() {
            ATTEMPT="$1"
            # %{time_total} is curl's own wall-clock for the whole transfer -- the cold start is
            # inside it, since Cloud Run holds the connection open while the instance boots.
            RESP=$(curl -sS -w "\n%{http_code} %{time_total}" --max-time "$HARD_LIMIT_S" "${{ env.SERVICE_URL }}/health")
            META=$(echo "$RESP" | tail -1)
            HTTP_CODE=${META%% *}
            ELAPSED=${META##* }
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP $HTTP_CODE in ${ELAPSED}s (attempt $ATTEMPT)"
            echo "$BODY"
            # Greppable marker, same convention as the kill-switch's AUTOMATED_KILLSWITCH_FIRED:
            # makes latency recoverable from run logs later without adding a metrics backend.
            echo "HEALTH_LATENCY {\"attempt\":$ATTEMPT,\"seconds\":$ELAPSED,\"http\":$HTTP_CODE}"
            [ "$HTTP_CODE" = "200" ] || return 1
            STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            [ "$STATUS" = "ok" ] || return 1
            # Attempt 1 is the only meaningful cold-start sample: if it succeeded, attempt 2
            # never runs, and if it failed the instance is already warm for the retry. So the
            # trend warning is scoped to attempt 1 -- warning on a warm retry would measure
            # nothing and train the reader to ignore the marker.
            if [ "$ATTEMPT" = "1" ] && awk "BEGIN{exit !($ELAPSED > $SOFT_LIMIT_S)}"; then
              echo "::warning::/health answered in ${ELAPSED}s, past the ${SOFT_LIMIT_S}s soft limit (hard fail at ${HARD_LIMIT_S}s). The service is UP -- this is a cold-start trend signal, not an outage. Cold start measured 36s on 2026-08-10; investigate what grew before it reaches ${HARD_LIMIT_S}s and starts reading as downtime."
            fi
          }
          if check 1; then
            echo "Health check passed."
            exit 0
          fi
          echo "First attempt failed -- retrying once before alerting."
          if check 2; then
            echo "Health check passed on retry."
            exit 0
          fi
          echo "::error::/health failed twice in a row -- service may be down (billing, quota, crash-looping, or a bad deploy), or degraded (200 but status != ok)."
          exit 1

  triage-check:
    # 2026-08-18 addition (Item 271/C6): /health only reports model-store state -- it has
    # never actually exercised the real user-facing path. Before this, the ONLY thing that
    # ever hit /triage was deploy.yml's own smoke test, and only at deploy time; between
    # deploys, a regression in the actual inference path (a broken model file, a Groq API
    # change, a serialization bug) had no standing check at all. This job closes that gap on
    # its own 6-hourly schedule (see the second `cron:` entry above) rather than every 30min:
    # /triage calls Groq for real, unlike /health.
    #
    # Cost is not a real concern despite that: this reuses the EXACT SAME synthetic payload
    # deploy.yml's smoke test has used on every deploy since it was written (repo=
    # microsoft/vscode, same title/body), and app.py wires an LLMCache keyed on request
    # content in front of the Groq call (_cache_hits_total/_cache_misses_total). That payload
    # has almost certainly been cached since the first deploy that ran the smoke test, so this
    # job's calls are expected to be cache hits, not new billed Groq tokens -- deliberately NOT
    # varying the payload, precisely to keep hitting that cache instead of generating fresh
    # spend on every run.
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: POST /triage with a synthetic issue, fail on non-200 or empty prediction
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" --max-time 60 -X POST "${{ env.SERVICE_URL }}/triage" \
            -H "Content-Type: application/json" \
            -d '{"repo":"microsoft/vscode","title":"Extension host crashes on startup","body":"Every time I open VS Code the extension host process terminates immediately."}')
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/triage returned HTTP $HTTP_CODE -- the real user-facing inference path is broken, even if /health is reporting OK."
            exit 1
          fi
          COMPONENT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('predicted_component',''))" 2>/dev/null || echo "")
          if [ -z "$COMPONENT" ]; then
            echo "::error::/triage returned 200 but predicted_component is empty/missing -- degraded, not down. Same failure shape as the /health status!=ok case."
            exit 1
          fi
          echo "Triage check passed -- predicted_component=$COMPONENT"
