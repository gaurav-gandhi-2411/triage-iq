name: CI

# Every push and every PR, whatever its base branch (was: main only). 2026-09-24: the
# #113-#130 stack targeted intermediate branches, so none of those PRs ran this workflow's
# unit tests, lint or security audit. A tiktoken import added in that stack reached the
# integration PR with the package missing from requirements.lock, and would have crashed
# every /triage request in production. Same trigger set as eval-gate.yml.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # 2026-10-05: Dependabot raised two floors in requirements.txt (sentence-transformers
      # >=5.7.0, groq >=1.6.0) without regenerating requirements.lock; prod installs from the
      # lock, so the two silently diverged and every later scoped regen dragged both upgrades
      # in. This regenerates the lock (no upgrades, python:3.11-slim, header's own command)
      # and fails on any non-comment diff. The regen takes ~10 min (torch metadata), so it runs
      # only when requirements.txt, requirements.lock or the checker changed; if the changed
      # set cannot be determined (new branch, shallow history) it RUNS rather than skips.
      - name: Lock in sync with requirements.txt
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          run_check=1
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; else base="$BEFORE_SHA"; fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD || echo UNKNOWN)"
            if [ "$changed" != "UNKNOWN" ] && ! echo "$changed" | grep -qE '^(requirements\.txt|requirements\.lock|scripts/check_lock_in_sync\.py)$'; then
              run_check=0
            fi
          fi
          if [ "$run_check" = "0" ]; then
            echo "requirements.txt / requirements.lock unchanged; lock-sync check not needed."
          else
            python scripts/check_lock_in_sync.py
          fi

      - name: Security audit
        run: |
          # All 8 suppressions below are justified in DEPENDENCIES.md (unreachable code
          # paths, verified directly against this codebase's actual usage — not blanket
          # ignores). 22 other CVEs (aiohttp/idna/starlette/pydantic-settings) were FIXED
          # via a surgical requirements.lock bump in the 2026-07-10 hygiene pass, and 8
          # pillow CVEs were FIXED via a pillow 12.2.0->12.3.0 bump in the 2026-07-16
          # pass — not suppressed. See DEPENDENCIES.md and the hygiene-pass ADR for the
          # full triage.
          #
          # CVE-2026-1839: unsafe torch.load() in Trainer._load_rng_state()
          # (transformers/trainer.py) — training-checkpoint-restoration path. The served
          # inference API never imports Trainer; only the offline training script
          # (scripts/deberta_train.py) does, and it has no external attack surface (no
          # file-upload/model-path surface, requires local filesystem write access + explicit
          # invocation). NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-1839
          #
          # PYSEC-2025-217: X-CLIP checkpoint-conversion-script RCE. TriageIQ never imports
          # X-CLIP or runs any checkpoint-conversion script.
          #
          # CVE-2026-4372: transformers config-injection RCE, requires the optional
          # `kernels` package (not installed here) AND an untrusted model config injection
          # point (TriageIQ loads exactly one fixed, trusted model, BAAI/bge-base-en-v1.5).
          # NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-4372
          #
          # CVE-2025-3000: torch.jit.script memory corruption on scripted classes with list
          # attributes. TriageIQ never calls torch.jit.script/trace/compile anywhere.
          #
          # PYSEC-2026-2290: transformers LightGlue model-loading `trust_remote_code`
          # override RCE. TriageIQ never loads a LightGlue model; the only raw
          # AutoModel.from_pretrained() call (scripts/w3_t4_train.py) uses a hardcoded,
          # fixed model ID, never an attacker-suppliable one.
          #
          # CVE-2026-9856: transformers save_pretrained() path traversal via untrusted
          # chat_template dict keys used as filenames. The only save_pretrained() call
          # sites in this repo (4 offline training scripts) all load their tokenizer from
          # a hardcoded, trusted model ID (BAAI/bge-base-en-v1.5 or
          # microsoft/deberta-v3-base), never an attacker-suppliable repo -- no reachable
          # surface. See DEPENDENCIES.md for the full reachability analysis.
          #
          # PYSEC-2026-3447: setuptools MANIFEST.in exclude-pattern Unicode-normalization
          # bypass — requires building an sdist on macOS APFS/HFS+. This repo has no
          # MANIFEST.in/setup.py, never builds an sdist, and runs on Linux everywhere.
          #
          # PYSEC-2026-3716 (datasets) and CVE-2026-63374 / CVE-2026-64847 (anyio) were
          # suppressed until 2026-10-07 only because the lock could not be regenerated without
          # dragging in the sentence-transformers/groq refresh (floor drift, fixed in #139).
          # They are now FIXED by a scoped regen (datasets 5.0.1, anyio 4.14.2), and their
          # ignores are removed. So are the two new advisories multidict CVE-2026-104874 and
          # fsspec CVE-2026-104851 (multidict 6.9.1, fsspec 2026.6.0): fixed, never suppressed.
          #
          # Transformers findings (all but PYSEC-2026-3447): fix requires
          # transformers>=5.0.0rc3 (needs sentence-transformers>=5.x, a triple major bump)
          # or, for CVE-2025-3000, no fix version is published at all. Revisit when a
          # planned dependency refresh is scheduled (not bundled into an unrelated PR) —
          # see DEPENDENCIES.md for each entry's specific revisit trigger.
          pip-audit -r requirements.lock --skip-editable \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln CVE-2026-9856 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-4164 \
            --ignore-vuln PYSEC-2026-4174
          # PYSEC-2026-4164 (sentence-transformers 2.7.0; fix only in 5.6.0) and
          # PYSEC-2026-4174 (transformers 4.57.6; no fix published), both published
          # 2026-10-01. Explicitly authorized by GG 2026-10-05; the only two entries added.
          # Unreachable here: the prod image bakes the embedder at build time with
          # HF_HUB_OFFLINE=1, the single model-loading call site (similar_issues.py:121)
          # uses a hardcoded model ID, and nothing calls transformers generate().
          # DEPENDENCIES.md names the conditions that would make each reachable.
          # The three urllib3 advisories published the same day are FIXED (lock regen), not
          # suppressed.

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/triage_iq/api/ src/triage_iq/models/triage.py

      - name: Run tests
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: python -m pytest tests/ --no-header

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn

  # The former "Dependency vulnerability audit (informational)" job was removed 2026-10-07: it
  # audited a freshly resolved environment (not the lock that ships) without the documented
  # suppressions, so it was red by construction and a permanently red check teaches everyone to
  # ignore red. The blocking audit of requirements.lock is the "Security audit" step above.
