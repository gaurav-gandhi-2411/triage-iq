name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Security audit
        run: |
          # All 4 suppressions below are justified in DEPENDENCIES.md (unreachable code
          # paths, verified directly against this codebase's actual usage — not blanket
          # ignores). 22 other CVEs (aiohttp/idna/starlette/pydantic-settings) were FIXED
          # via a surgical requirements.lock bump in the 2026-07-10 hygiene pass, not
          # suppressed — see DEPENDENCIES.md and the hygiene-pass ADR for the full triage.
          #
          # CVE-2026-1839: unsafe torch.load() in Trainer._load_rng_state()
          # (transformers/trainer.py) — training-checkpoint-restoration path. TriageIQ never
          # imports Trainer. NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-1839
          #
          # PYSEC-2025-217: X-CLIP checkpoint-conversion-script RCE. TriageIQ never imports
          # X-CLIP or runs any checkpoint-conversion script.
          #
          # CVE-2026-4372: transformers config-injection RCE, requires the optional
          # `kernels` package (not installed here) AND an untrusted model config injection
          # point (TriageIQ loads exactly one fixed, trusted model, BAAI/bge-base-en-v1.5).
          # NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-4372
          #
          # CVE-2025-3000: torch.jit.script memory corruption on scripted classes with list
          # attributes. TriageIQ never calls torch.jit.script/trace/compile anywhere.
          #
          # All four: fix requires transformers>=5.0.0rc3 (needs sentence-transformers>=5.x,
          # a triple major bump) or, for CVE-2025-3000, no fix version is published at all.
          # Revisit when a planned dependency refresh is scheduled (not bundled into an
          # unrelated PR) — see DEPENDENCIES.md for each entry's specific revisit trigger.
          pip-audit -r requirements.lock --skip-editable \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln CVE-2025-3000

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/triage_iq/api/ src/triage_iq/models/triage.py

      - name: Run tests
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: python -m pytest tests/ --no-header

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: warn

  pip-audit:
    name: Dependency vulnerability audit (informational)
    runs-on: ubuntu-latest
    # NON-BLOCKING: informational only — not a required status check. Only `test`
    # is required for merge. Findings here are a signal for future triage, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: pip-audit (installed environment)
        run: pip-audit
