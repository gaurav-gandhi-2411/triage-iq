name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Allowlist, not paths-ignore (2026-10-08): deploy only when something baked into the image
    # or run by this job changed. A merge that cannot change production (analysis scripts, eval,
    # tests, docs) must not spend Groq smoke-test tokens or risk a red deploy (#160 did, twice).
    # Pinned by tests/test_deploy_paths_filter.py against docker/Dockerfile.prod's COPY sources:
    # add a COPY there and that test fails until the path is listed here.
    paths:
      - 'src/**'                            # COPY src/ (code, prompts, loader, app)
      - 'pyproject.toml'                    # COPY pyproject.toml
      - 'requirements.lock'                 # COPY requirements.lock (pip layer)
      - 'docker/Dockerfile.prod'            # the image recipe itself
      - 'reports/eval_summary.json'         # baked in, served live by /eval/summary
      - 'reports/eval_baseline.json'        # baked in, read as current_llm_baseline
      - 'data/models/MANIFEST.sha256'       # baked in; model objects come from GCS, pinned by hash
      - 'scripts/verify_model_manifest.py'  # run by this job as the drift guard
      - '.github/workflows/deploy.yml'      # the deploy job itself
  workflow_dispatch:

# Serialize deploys to the same ref — two unordered concurrent `gcloud run
# deploy` calls against the same Cloud Run service is a real race (whichever
# finishes last wins traffic, regardless of which commit is newer).
# cancel-in-progress: false — queue, don't cancel a deploy mid-cutover.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  GCP_PROJECT: triageiq-prod-260812
  AR_REPO: triageiq
  SERVICE_NAME: triageiq-api
  IMAGE: us-central1-docker.pkg.dev/triageiq-prod-260812/triageiq/api
  RUNTIME_SA: triageiq-api-runtime@triageiq-prod-260812.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation (preferred over SA key)

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: triageiq-deployer@triageiq-prod-260812.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify model artifacts against manifest (drift guard)
        run: python scripts/verify_model_manifest.py

      - name: Download production models from GCS
        run: |
          mkdir -p data/models data/processed
          gsutil -m cp \
            "gs://triageiq-prod-260812-models/models/component_classifier_microsoft_vscode.pkl" \
            "gs://triageiq-prod-260812-models/models/component_classifier_kubernetes_kubernetes.pkl" \
            "gs://triageiq-prod-260812-models/models/resolution_predictor_microsoft_vscode.pkl" \
            "gs://triageiq-prod-260812-models/models/resolution_predictor_kubernetes_kubernetes.pkl" \
            "gs://triageiq-prod-260812-models/models/cqr_conformal_adjustments.json" \
            "gs://triageiq-prod-260812-models/models/cqr_conformal_adjustments_v2.json" \
            data/models/
          gsutil -m cp -r \
            "gs://triageiq-prod-260812-models/models/similar_issue_index_microsoft_vscode_bge" \
            "gs://triageiq-prod-260812-models/models/similar_issue_index_kubernetes_kubernetes_bge" \
            data/models/
          gsutil -m cp \
            "gs://triageiq-prod-260812-models/processed/microsoft_vscode_temporal_train.parquet" \
            "gs://triageiq-prod-260812-models/processed/kubernetes_kubernetes_temporal_train.parquet" \
            data/processed/

      - name: Build and push image
        run: |
          docker build \
            -f docker/Dockerfile.prod \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run (candidate, no traffic)
        id: deploy
        run: |
          # Note: both secrets must exist in Secret Manager before first deploy:
          #   gcloud secrets create groq-api-key --replication-policy=automatic
          #   gcloud secrets create metrics-token --replication-policy=automatic
          #
          # --no-traffic --tag=candidate: deploy the new revision WITHOUT moving any live
          # traffic to it. This is what makes the smoke test below meaningful -- it hits the
          # candidate's own stable tagged URL, not the public service URL, so it always tests
          # THIS deploy's code regardless of what the service's traffic split currently is.
          # (Root cause this replaces: a prior deploy's rollback can pin the service's traffic
          # to a specific named revision, silently disabling Cloud Run's default "auto-promote
          # newest deploy" behavior for every deploy after it -- see issue #22. Under the old
          # flow, a pinned service meant new revisions landed at 0% traffic while the smoke
          # test still curled the public URL and passed against stale, already-live code.)
          # Startup probe 10s period / 10s timeout / 30 failures (was 60/45/3). The app takes
          # ~41s p50 (n=303 prod cold starts, 2026-09-05..10-05) to finish lifespan, so the old
          # first probe at t=0 always failed and the next one fired at t=60s: readiness landed on
          # 60s boundaries and any start >60s jumped to 120s. Probing every 10s makes the
          # instance ready ~5-10s after the app is up. timeoutSeconds must not exceed
          # periodSeconds (Cloud Run docs); 30 x 10s = a 300s ceiling, more than the old 3 x 60s.
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 8 \
            --cpu-throttling \
            --timeout 300 \
            --startup-probe="httpGet.path=/health,httpGet.port=8080,timeoutSeconds=10,periodSeconds=10,failureThreshold=30" \
            --service-account ${{ env.RUNTIME_SA }} \
            --update-secrets GROQ_API_KEY=groq-api-key:latest,METRICS_TOKEN=metrics-token:latest \
            --update-env-vars ENVIRONMENT=prod \
            --no-traffic \
            --tag=candidate \
            --quiet
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.latestCreatedRevisionName)')
          CANDIDATE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['url'] for t in d['status']['traffic'] if t.get('tag') == 'candidate'))")
          PUBLIC_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Candidate revision: $REVISION"
          echo "Candidate URL (not yet promoted, tests THIS deploy only): $CANDIDATE_URL"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "candidate_url=$CANDIDATE_URL" >> $GITHUB_OUTPUT
          echo "url=$PUBLIC_URL" >> $GITHUB_OUTPUT

      - name: Smoke test (candidate revision, before it takes any traffic)
        id: smoke
        env:
          SMOKE_METRICS_TOKEN: ${{ secrets.SMOKE_TEST_METRICS_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.candidate_url }}"

          # 1. Health check — retry up to 5 times
          echo "=== /health ==="
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              break
            fi
            echo "Attempt $i: status $STATUS — retrying in 10s"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "FAILED: /health returned $STATUS"
            exit 1
          fi
          echo "Health: $(curl -sf "$URL/health")"

          # 1b. Dependency readiness (2026-09-24). Bare /health is liveness only -- it reports
          # groq_key_present, never whether Groq ACCEPTS the key. On 2026-09-24 a revoked
          # production key passed /health and was only caught by the /triage 500 below, with no
          # indication of the cause. ?deps=1 makes one zero-token authenticated Groq call and
          # returns 503 with a per-dependency detail, so a rejected key fails here, named.
          echo "=== /health?deps=1 ==="
          DRESP=$(curl -s -w "\n%{http_code}" "$URL/health?deps=1")
          DCODE=$(echo "$DRESP" | tail -1)
          DBODY=$(echo "$DRESP" | sed '$d')
          echo "$DBODY"
          if [ "$DCODE" != "200" ]; then
            if echo "$DBODY" | grep -q -E '401|invalid_api_key|AuthenticationError'; then
              echo "FAILED: Groq REJECTED the production API key (401). Add a new Secret Manager version of groq-api-key, then re-run this deploy."
            else
              echo "FAILED: /health?deps=1 returned HTTP $DCODE -- a dependency is unhealthy (see body above)."
            fi
            exit 1
          fi
          echo "Dependency check passed"

          # 2. Metrics endpoint — requires bearer token
          echo "=== /metrics ==="
          if [ -n "$SMOKE_METRICS_TOKEN" ]; then
            MSTATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $SMOKE_METRICS_TOKEN" "$URL/metrics")
            if [ "$MSTATUS" != "200" ]; then
              echo "FAILED: /metrics returned $MSTATUS"
              exit 1
            fi
            echo "Metrics check passed"
          else
            echo "SMOKE_TEST_METRICS_TOKEN not set — skipping /metrics check"
          fi

          # 3. Triage endpoint — synthetic issue
          #
          # 2026-09-03 (ADR-0055 Part P1b): predicted_component alone was NOT a
          # sufficient check -- it stays non-empty even when the LLM is fully dead and
          # every request silently degrades to a classifier-only fallback plan (the
          # exact failure mode PR #103's graceful-degradation change can produce). A
          # build where the LLM never actually answers would have passed this smoke
          # test undetected and shipped to 100% traffic. Now also asserts _degraded is
          # false and triage_summary is a real, non-empty string.
          echo "=== /triage ==="
          # Diagnostics only (assertions unchanged): capture the HTTP code and print the body
          # on a non-200 instead of letting `curl -f` abort with a bare exit 22.
          TRESP=$(curl -s -w "\n%{http_code}" -X POST "$URL/triage" \
            -H "Content-Type: application/json" \
            -d '{"repo":"microsoft/vscode","title":"Extension host crashes on startup","body":"Every time I open VS Code the extension host process terminates immediately."}')
          TCODE=$(echo "$TRESP" | tail -1)
          TBODY=$(echo "$TRESP" | sed '$d')
          if [ "$TCODE" != "200" ]; then
            echo "FAILED: /triage returned HTTP $TCODE -- body: $(echo "$TBODY" | head -c 500)"
            exit 1
          fi
          # Piped via stdin, not interpolated into the Python source -- $TBODY is
          # model-generated text (untrusted) and must never be embedded directly into
          # a script literal.
          echo "$TBODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          component = d.get('predicted_component')
          degraded = d.get('_degraded')
          summary = d.get('triage_summary')
          llm_status = d.get('_llm_status')
          llm_reason = d.get('_llm_status_reason')
          failures = []
          if not component:
              failures.append('predicted_component is empty')
          if degraded is not False:
              failures.append(f'_degraded is {degraded!r}, expected False -- llm_status={llm_status!r} llm_status_reason={llm_reason!r}')
          if not summary or not summary.strip():
              failures.append('triage_summary is empty')
          if failures:
              print('FAILED:', '; '.join(failures))
              sys.exit(1)
          print(f'Triage check passed — predicted_component={component} degraded={degraded} llm_status={llm_status}')
          "
          if [ $? -ne 0 ]; then
            exit 1
          fi

      - name: Promote candidate to live traffic
        id: promote
        if: success()
        run: |
          # --to-latest (not --to-revisions <name>=100): always re-asserts "traffic follows
          # the newest ready revision" as the service's ongoing policy, rather than pinning to
          # this one revision by name. This is what makes a successful deploy self-healing --
          # even if a PRIOR deploy's failure had pinned traffic to some old revision by name
          # (disabling auto-promotion), this step overwrites that pin on every green deploy,
          # so the drift can no longer persist silently across deploys (issue #22).
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --to-latest
          echo "Promoted ${{ steps.deploy.outputs.revision }} to 100% live traffic."

      - name: Report candidate smoke-test failure (no rollback needed)
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          # The candidate was deployed with --no-traffic, so it never received any live
          # traffic -- whatever was serving before this run is still serving now, unaffected.
          # No traffic rollback is needed by construction. This just surfaces the failure
          # clearly rather than silently leaving the failed candidate revision around.
          echo "Smoke test failed for candidate revision ${{ steps.deploy.outputs.revision }}."
          echo "Live traffic was never moved to it -- the previously-live revision is still serving."
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format "value(status.traffic)"
          exit 1

      - name: Print deployment URL
        if: success()
        run: echo "Deployed to ${{ steps.deploy.outputs.url }} (revision ${{ steps.deploy.outputs.revision }})"
